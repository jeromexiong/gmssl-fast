[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "gmssl-fast"
version = "0.1.0"
description = "基于 GmSSL 的国密算法（SM2/SM3/SM4）Python 扩展，静态链接、零系统依赖"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
# 测试专用。snowland-smx 是「旧库」，用于与存量实现的**双向**对拍
# （tests/test_cross_fastapiadmin.py）；不装则该文件整体跳过。
test = ["pytest>=8.0", "snowland-smx>=1.0"]

[tool.maturin]
python-source = "python"
module-name = "gmssl_fast._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
