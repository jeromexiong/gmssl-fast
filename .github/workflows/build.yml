name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # 手动触发可以在不打 tag 的情况下跑完整 4 平台 wheel（publish 仍然只在 tag 上跑），
  # 用来验证平台构建而不惊动 PyPI。
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------ PR 门禁（只要 Linux，快）
  test:
    name: fmt / clippy / cargo test / pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 环境自检（GmSSL 由 CMake 构建，缺 cmake 必须在这里就暴露）
        run: |
          cmake --version
          cargo --version
          python --version

      - name: 安装构建与测试依赖
        # snowland-smx 是「旧库」：tests/test_cross_fastapiadmin.py 用它做双向对拍，
        # 缺了该文件会整体 skip —— CI 里要真的跑，所以必须装。
        run: pip install -U maturin pytest snowland-smx

      - name: 格式
        run: cargo fmt --all -- --check

      - name: 断言不得依赖概率（机械检查）
        # 历史事故：assert_ne!(raw[0], 0x30) 打在随机密文上 —— 该字节本身就有约 1/256
        # 概率等于 0x30（8000 次采样实测 0.537%），一轮 CI 约 1% 概率假失败。
        run: python scripts/lint_test_asserts.py

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust 单元测试
        run: cargo test --locked

      - name: 构建 wheel
        run: maturin build --release --locked --out dist

      - name: 安装 wheel
        # CI 没有 venv，maturin develop 用不了；改成装真轮子——
        # 这样测的就是用户最终拿到的那份产物，顺带验证打包本身。
        run: pip install --force-reinstall --no-deps dist/*.whl

      - name: Python 测试
        run: pytest -q

  # ------------------------------------------------------------ 4 平台 abi3 wheel
  wheels:
    name: wheel / ${{ matrix.target }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ⚠️ Windows（x86_64-pc-windows-msvc）暂不在列：上游链路在 MSVC 下构建不过。
        # CI 实测 3 次：GmSSL 3.1.1 的 api.h / socket.h / dylib.h 用 `#ifdef WIN32`，
        # 而 cmake-rs 会自己设 CMAKE_C_FLAGS / CMAKE_C_FLAGS_RELEASE，把 CMake 平台
        # 默认的 /DWIN32 顶掉 → 代码走 POSIX 分支 → MSVC 报 C1083 缺 dlfcn.h / netdb.h。
        # 已试过 CMAKE_C_FLAGS=/DWIN32 与
        # CMAKE_C_FLAGS_RELEASE=/DWIN32;/MD;/O2;/Ob2;/DNDEBUG（VS 生成器只认后者），
        # 宏都没能真正到达 cl.exe。要拿下 Windows 得走设计 §9 的 R3：
        # vendor 上游两个 crate + 自控构建配方，顺手给 GmSSL 补一句
        # `#if defined(_WIN32) && !defined(WIN32)` → `#define WIN32`。
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: auto
          - target: aarch64-apple-darwin
            os: macos-latest # arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel # 唯一还在售的 Intel macOS runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # 非 Linux 腿的矩阵项没有 manylinux 字段（null）→ 回退成 'auto'，
          # 免得把空值传进 action 的输入。
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist
          # manylinux 镜像应该自带 cmake（pypa/manylinux 的 issue 就在用容器内的 cmake），
          # 但本机拉不到镜像、没能在真容器里验证 → 缺失就兜底安装；
          # `cmake --version` 无条件执行，首跑日志会把真实版本变成确定事实。
          before-script-linux: |
            command -v cmake >/dev/null 2>&1 || python3 -m pip install cmake
            cmake --version

      - name: 校验产物（Linux 必须是 manylinux，PyPI 不接受裸 linux_x86_64）
        if: matrix.manylinux == 'auto'
        run: |
          ls -l dist
          ls dist/*manylinux*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  # ------------------------------------------------------------ 发布（单独一个 job，避免矩阵内竞争）
  publish:
    name: publish to PyPI
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # 供 Trusted Publishing 使用（配置后可删掉下面的 password）
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: 发布前清点
        run: ls -l dist && ls dist/*.whl | wc -l

      - name: 发布
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 首次先发 TestPyPI 验证（需要 secrets.TEST_PYPI_API_TOKEN）；
          # 确认无误后删掉 repository-url，并换成 secrets.PYPI_API_TOKEN 或 Trusted Publishing。
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
