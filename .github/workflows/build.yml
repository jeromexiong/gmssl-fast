name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # 手动触发可以在不打 tag 的情况下跑完整 4 平台 wheel（publish 仍然只在 tag 上跑），
  # 用来验证平台构建而不惊动 PyPI。
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------ PR 门禁（只要 Linux，快）
  test:
    name: fmt / clippy / cargo test / pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 环境自检（GmSSL 由 CMake 构建，缺 cmake 必须在这里就暴露）
        run: |
          cmake --version
          cargo --version
          python --version

      - name: 安装构建与测试依赖
        # snowland-smx 是「旧库」：tests/test_cross_legacy.py 用它做双向对拍，
        # 缺了该文件会整体 skip —— CI 里要真的跑，所以必须装。
        run: pip install -U maturin pytest snowland-smx

      - name: 格式
        run: cargo fmt --all -- --check

      - name: 断言不得依赖概率（机械检查）
        # 历史事故：assert_ne!(raw[0], 0x30) 打在随机密文上 —— 该字节本身就有约 1/256
        # 概率等于 0x30（8000 次采样实测 0.537%），一轮 CI 约 1% 概率假失败。
        run: python scripts/lint_test_asserts.py

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust 单元测试
        run: cargo test --locked

      - name: 构建 wheel
        run: maturin build --release --locked --out dist

      - name: 安装 wheel
        # CI 没有 venv，maturin develop 用不了；改成装真轮子——
        # 这样测的就是用户最终拿到的那份产物，顺带验证打包本身。
        run: pip install --force-reinstall --no-deps dist/*.whl

      - name: Python 测试
        run: pytest -q

  # ------------------------------------------------------------ 多平台 abi3 wheel
  wheels:
    name: wheel / ${{ matrix.target }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows（x86_64-pc-windows-msvc）之前构建不过，根因是上游链路在 MSVC 上的两处硬伤：
        # ① GmSSL 的 api.h / socket.h / dylib.h 用 `#ifdef WIN32`，而 MSVC 只预定义 _WIN32。
        #    CMake 的 Windows-MSVC 平台模块本会补 /DWIN32，但 cmake-rs 会自己覆盖
        #    CMAKE_C_FLAGS / CMAKE_C_FLAGS_RELEASE 把它顶掉 → 代码走 POSIX 分支 → C1083
        #    缺 dlfcn.h / netdb.h。（实测走环境变量传 CMAKE_C_FLAGS(_RELEASE) 都到不了 cl.exe。）
        # ② GmSSL 的 CMakeLists.txt 硬编码 CMAKE_INSTALL_PREFIX="C:/Program Files/GmSSL"，
        #    且 VS 是多配置生成器（库落在 lib/Release/），而 0.1.0 的 build.rs 只认 dst/lib。
        # 上游 GmSSL/gmssl-rs@main 已修好这两点（cflag("-DWIN32") + 打补丁 CMakeLists +
        # find_lib_dir），但**没有发版**：crates.io 上仍是修复前的 0.1.0。
        # 因此通过 Cargo.toml 的 [patch.crates-io] 钉住一份回移了该修复的 0.1.0 副本：
        #   https://github.com/jeromexiong/gmssl-rs-patched
        # 它与 crates.io 只有 build.rs / pem_helpers.rs 两个文件不同，GmSSL 仍是 3.1.1 且源码随
        # crate 一起分发（构建不需要下载 GmSSL、不需要 submodule）；rev 由 Cargo.lock + --locked 钉死。
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: auto
          # ARM Linux：曾在 x86_64 runner 上试过这腿（run 36247530045）——失败，原因是那里跑
          # manylinux aarch64 容器需要 binfmt/qemu，而编排层没注册（Node 侧 ChildProcess 异常，
          # 不是 GmSSL 编译问题：本机 podman 起原生 aarch64 容器已实测能建出轮子并跑通测试）。
          # 仓库转为公开后 ARM runner 免费且规格更高（4C/16GB），于是改用 **原生** runner：
          # 无需 qemu、构建更快，还能就地跑运行期验证。
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            manylinux: auto
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            # Alpine / musl 容器场景：musllinux 容器能正常编译 GmSSL（实测通过 ✓）
            manylinux: musllinux_1_2
          # ARM 上的 Alpine（树莓派 / ARM 容器）：同样走原生 ARM runner
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            manylinux: musllinux_1_2
          - target: aarch64-apple-darwin
            os: macos-latest # arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel # 唯一还在售的 Intel macOS runner
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # Windows ARM64（Snapdragon 笔记本 / Surface Pro X）：`windows-11-arm` 是 GitHub 托管的
          # **原生** ARM64 runner（公私有仓库都有），不需要 qemu，因此除了构建还能就地做
          # 「装真轮子 + 跑 pytest」——正是 x64 腿因为 /FORCE:UNRESOLVED 必须补的那类运行期证据。
          # Python 侧：CPython ≥ 3.11 有官方 win-arm64 构建，轮子平台标签 win_arm64，PyPI/pip 都认。
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # 非 Linux 腿的矩阵项没有 manylinux 字段（null）→ 回退成 'auto'，
          # 免得把空值传进 action 的输入。
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist
          # manylinux 镜像应该自带 cmake（pypa/manylinux 的 issue 就在用容器内的 cmake），
          # 但本机拉不到镜像、没能在真容器里验证 → 缺失就兜底安装；
          # `cmake --version` 无条件执行，首跑日志会把真实版本变成确定事实。
          before-script-linux: |
            command -v cmake >/dev/null 2>&1 || python3 -m pip install cmake
            cmake --version

      - name: 校验产物标签（PyPI 不接受裸 linux_*.whl）
        # glibc 腿必须落 manylinux*、musl 腿必须落 musllinux*，否则要到上传时才会被打回。
        if: runner.os == 'Linux'
        run: |
          ls -l dist
          for w in dist/*.whl; do
            case "$w" in
              *manylinux*|*musllinux*) ;;
              *) echo "❌ 标签不合规（PyPI 会拒收）: $w"; exit 1 ;;
            esac
          done
          echo "✅ 标签合规"

      - name: 运行期验证（装真轮子 + 跑完整测试）
        # 只跑非 musl 腿：musllinux 轮子没法装在 glibc runner 上（见下面 musl 专用步骤）。
        if: matrix.manylinux != 'musllinux_1_2'
        # 为什么每条腿都要做：Windows 两条腿用了 /FORCE:UNRESOLVED 放宽链接（crates.io 的
        # gmssl-rs 0.1.1 声明了两个 GmSSL 3.2.0 才有的符号，详见 build.rs）—— 代价是「真缺符号」
        # 不再在链接期报错 → 必须由**运行期证据**兜底。其余腿顺带做同一件事，证明
        # 「轮子在这台原生机器上真的能 import、能算出正确 SM3」——构建成功 ≠ 可用。
        # 所有腿都是原生 runner（含 ARM Linux / ARM Windows），不存在「交叉编译未验证」的缺口；
        # snowland-smx 装不上也不影响（对拍用例会 importorskip 自动跳过）。
        #
        # ⚠️ shell 必须是 bash：Windows runner 默认是 pwsh，它不展开 `dist/*.whl`，
        # pip 会收到字面量 `*` 并报 `Invalid wheel filename (wrong number of parts): '*'`
        # （第一次就是这么翻的）。三平台都有 bash（win11-arm 镜像自带 Bash 5.3）。
        shell: bash
        run: |
          python -m pip install -U pytest
          python -m pip install -U snowland-smx || true
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import gmssl_fast; assert gmssl_fast.sm3_hex(b'abc').startswith('66c7f0f4')"
          pytest tests -q

      - name: 运行期验证（musl 腿：在 musl 容器里装真轮子 + 跑测试）
        # musllinux 轮子装到 glibc runner 上会被 pip 直接拒：
        #   `... is not a supported wheel on this platform`
        # —— 不是坏轮子，是平台标签不匹配（上一轮两条 musl 腿就栽在这里：轮子建出来了、
        # 标签也合规，是验证步骤搭错了地方）。要拿运行期证据只能在 musl 容器里验，
        # 容器用构建时同一个镜像（runner 是原生架构，所以 uname -m 直接对得上镜像后缀）。
        if: matrix.manylinux == 'musllinux_1_2'
        shell: bash
        run: |
          IMG="quay.io/pypa/musllinux_1_2_$(uname -m)"
          echo "容器: $IMG"
          docker run --rm -v "$PWD":/w -w /w "$IMG" bash -c 'PY=$(ls -d /opt/python/cp312-cp312/bin/python || ls -d /opt/python/*/bin/python | tail -1); echo "python: $PY"; $PY -m pip install -q pytest; $PY -m pip install -q --force-reinstall --no-deps dist/*.whl; $PY -m pytest tests -q'

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  # ------------------------------------------------------------ 发布（单独一个 job，避免矩阵内竞争）
  publish:
    name: publish to PyPI
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing（OIDC）：不需要任何 secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: 发布前清点
        run: ls -l dist && ls dist/*.whl | wc -l

      - name: 发布
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 走 Trusted Publishing（OIDC），所以**不传 password**（本仓库没有任何 secret）。
          # 前提是在目标站配好 pending publisher，四项都要对上：
          #   TestPyPI（当前）：项目 gmssl-fast / 仓库 jeromexiong/gmssl-fast /
          #                    workflow build.yml / environment pypi
          # 发正式 PyPI 时：在 pypi.org 配同样的 pending publisher，然后删掉下面这行。
          repository-url: https://test.pypi.org/legacy/
