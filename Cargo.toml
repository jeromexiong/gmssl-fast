[package]
name = "gmssl-fast"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

# gmssl-rs-sys 0.1.0 的 Windows/MSVC 修复在上游 GmSSL/gmssl-rs@main 里已有，
# 但尚未发版（crates.io 仍是修复前的 0.1.0）。这里钉住一份回移了该修复的 0.1.0
# 副本（GmSSL 仍为 3.1.1，仅 build.rs 不同）：
# https://github.com/jeromexiong/gmssl-rs-sys-patched
# 上游发布含该修复的版本后，删掉这个 [patch] 段落即可。
[patch.crates-io]
gmssl-rs-sys = { git = "https://github.com/jeromexiong/gmssl-rs-sys-patched", rev = "791d8f3944073e53452ee6ecbfcdae544f3192b4" }

[dependencies]
gmssl-rs = "0.1.1"
# 注意：extension-module 只在打 wheel 时启用（见 pyproject.toml 的 [tool.maturin]），
# 否则 `cargo test` 会因缺 libpython 符号而链接失败。
pyo3 = { version = "0.29", features = ["abi3-py38"] }
