[package]
name = "gmssl-fast"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

# 上游 GmSSL/gmssl-rs@main 里已有两处 Windows 修复，但**都还没有发版**
# （crates.io 上 gmssl-rs-sys 只有 0.1.0、gmssl-rs 只有 0.1.1）：
#   ① gmssl-sys/build.rs：MSVC 下缺 WIN32 宏（→ C1083 缺 dlfcn.h/netdb.h）、
#      GmSSL 硬编码的 CMAKE_INSTALL_PREFIX、VS 多配置生成器的 lib/<Config>/、advapi32；
#   ② gmssl/src/pem_helpers.rs：POSIX 专属的 fmemopen/open_memstream 在 Windows 上不存在。
# 这里钉住一份把这两处回移好的副本（布局按上游仓库：gmssl/ + gmssl-sys/，
# 且 gmssl 对 gmssl-sys 是 path 依赖 ⇒ **一条 patch 就够**，sys 从同一 rev 解析）：
#   https://github.com/jeromexiong/gmssl-rs-patched @e05fd64
# 该副本只有那两个文件与 crates.io 字节不同；GmSSL 仍为 3.1.1 且源码随 crate 分发
# ⇒ 无下载、无 submodule、API/ABI 与本机已验证版本逐字节一致。
# 上游发布含修复的版本后，删掉这个 [patch] 段落即可。
[patch.crates-io]
gmssl-rs = { git = "https://github.com/jeromexiong/gmssl-rs-patched", rev = "e05fd649fd989103e2f4300fec27b76fae33422a" }

[dependencies]
gmssl-rs = "0.1.1"
# 注意：extension-module 只在打 wheel 时启用（见 pyproject.toml 的 [tool.maturin]），
# 否则 `cargo test` 会因缺 libpython 符号而链接失败。
pyo3 = { version = "0.29", features = ["abi3-py38"] }
